<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrar • Orderly</title>

<link rel="stylesheet" href="../css/home.css">
</head>

<body>

<main class="container" style="max-width:450px;padding-top:80px">

    <div class="restaurant-card">

        <div class="restaurant-info">

            <h1 class="restaurant-name">
                Entrar no Orderly
            </h1>

            <p>
                Acesse sua conta para acompanhar seus pedidos.
            </p>


            <form id="loginCliente">

                <div style="margin-bottom:15px">

                    <label>
                        E-mail
                    </label>

                    <input
                        id="email"
                        type="email"
                        class="search-input"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div style="margin-bottom:15px">

                    <label>
                        Senha
                    </label>

                    <input
                        id="senha"
                        type="password"
                        class="search-input"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    class="restaurant-button"
                    type="submit"
                >
                    Entrar
                </button>

            </form>


            <p style="margin-top:20px">

                Ainda não possui conta?

                <a href="./cadastro.html">
                    Criar conta
                </a>

            </p>


        </div>

    </div>

</main>


<script type="module">

import {
    loginCliente
} from "../js/services/auth-cliente.js";


const form =
document.getElementById("loginCliente");


form.addEventListener("submit", async (e)=>{

    e.preventDefault();


    const email =
        document.getElementById("email").value.trim();


    const senha =
        document.getElementById("senha").value;



    if(!email || !senha){

        alert("Preencha todos os campos.");

        return;

    }


    try{


        const usuario =
            await loginCliente(
                email,
                senha
            );


        console.log(
            "Usuário logado:",
            usuario.uid
        );


        window.location.replace(
            "./perfil.html"
        );


    }catch(error){


        console.error(
            "Erro login cliente:",
            error
        );


        alert(
            "E-mail ou senha inválidos."
        );

    }


});


</script>

</body>
</html>
