<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editar perfil - Orderly</title>


<link rel="stylesheet" href="../css/styles.css">


</head>


<body class="cliente-body">



<header class="perfil-header">


<a href="./perfil.html">

<strong>
Orderly
</strong>

</a>


<a href="./perfil.html">
Voltar
</a>


</header>




<main class="perfil-container">



<section class="perfil-card">


<h1>
✏️ Editar perfil
</h1>



<form id="perfilForm">


<div class="campo">

<label>
Nome
</label>


<input
id="nome"
class="form-control mb-3"
placeholder="Nome completo"
required
>


</div>



<div class="campo">

<label class="form-label">
Telefone
</label>


<input
id="telefone"
class="form-control mb-3"
placeholder="+55 (19) 99999-9999"
maxlength="19"
inputmode="numeric"
/>


</div>



<div class="campo">

<label>
E-mail
</label>


<input
id="email"
class="form-control mb-3"
type="email"
disabled
>


</div>



<button class="btn-finalizar">

Salvar alterações

</button>



</form>


</section>


</main>




<script type="module">


import {
observarCliente
} from "../js/services/auth-cliente.js";


import {
db
} from "../js/services/firebase.js";


import {
doc,
getDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



let uid;



const nome =
document.getElementById("nome");


const telefone =
document.getElementById("telefone");


const email =
document.getElementById("email");

const formatarTelefone = (valor) => {

    valor = valor.replace(/\D/g, "");

    valor = valor.substring(0, 13);


    if(valor.length <= 2){
        return "+" + valor;
    }


    if(valor.length <= 4){
        return "+" + valor.substring(0,2) 
        + " (" + valor.substring(2);
    }


    if(valor.length <= 9){
        return "+" + valor.substring(0,2)
        + " (" + valor.substring(2,4)
        + ") " + valor.substring(4);
    }


    return "+" + valor.substring(0,2)
    + " (" + valor.substring(2,4)
    + ") " + valor.substring(4,9)
    + "-" + valor.substring(9,13);

};

telefone.addEventListener("input",()=>{

    telefone.value =
        formatarTelefone(
            telefone.value
        );

});

observarCliente(async(user)=>{


if(!user){

window.location.href="./login.html";

return;

}


uid=user.uid;


email.value=user.email;



const ref =
doc(
db,
"clientes",
uid
);


const snap =
await getDoc(ref);



if(snap.exists()){


const dados =
snap.data();


nome.value =
dados.nome || "";


telefone.value =
formatarTelefone(
    dados.telefone || ""
);


}



});




document
.getElementById("perfilForm")
.addEventListener(
"submit",
async(e)=>{


e.preventDefault();



await updateDoc(

doc(
db,
"clientes",
uid
),

{


nome:
nome.value,


telefone:
telefone.value.replace(/\D/g,"")


}

);



alert(
"Perfil atualizado!"
);



window.location.href="./perfil.html";


});



</script>


</body>

</html>
