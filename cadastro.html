<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Loja - Orderly</title>

<link rel="stylesheet" href="./css/cadastro.css">

</head>


<body>


<div class="cadastro-card">


<h2>
Cadastre sua loja
</h2>


<p>
Crie sua conta no Orderly
</p>



<form id="cadastroForm">


<h3>
Dados da empresa
</h3>


<input 
id="nomeFantasia"
placeholder="Nome fantasia"
/>


<input 
id="razaoSocial"
placeholder="Razão social"
/>


<input 
id="cnpj"
placeholder="CNPJ"
/>


<input 
id="telefone"
placeholder="Telefone"
/>


<input 
id="whatsapp"
placeholder="WhatsApp"
/>


<input 
id="emailEmpresa"
placeholder="Email da empresa"
/>


<input 
id="endereco"
placeholder="Endereço"
/>


<input 
id="cidade"
placeholder="Cidade"
/>


<input 
id="estado"
placeholder="Estado"
/>



<h3>
Dados do administrador
</h3>


<input 
id="nomeAdmin"
placeholder="Nome"
/>


<input 
id="emailAdmin"
placeholder="Email"
/>


<input 
id="senha"
type="password"
placeholder="Senha"
/>


<input 
id="confirmarSenha"
type="password"
placeholder="Confirmar senha"
/>



<button type="submit">
Criar loja
</button>


</form>


</div>

<script type="module">

import {
  cadastrarEmpresa
} from "./js/services/cadastro-empresa.js";



const form =
document.getElementById("cadastroForm");



form.addEventListener(
"submit",
async(e)=>{


e.preventDefault();



const dados = {


nomeFantasia:
document.getElementById("nomeFantasia").value.trim(),


razaoSocial:
document.getElementById("razaoSocial").value.trim(),


cnpj:
document.getElementById("cnpj").value.trim(),


telefone:
document.getElementById("telefone").value.trim(),


whatsapp:
document.getElementById("whatsapp").value.trim(),


emailEmpresa:
document.getElementById("emailEmpresa").value.trim(),


endereco:
document.getElementById("endereco").value.trim(),


cidade:
document.getElementById("cidade").value.trim(),


estado:
document.getElementById("estado").value.trim(),



nomeAdmin:
document.getElementById("nomeAdmin").value.trim(),


emailAdmin:
document.getElementById("emailAdmin").value.trim(),


senha:
document.getElementById("senha").value,


confirmarSenha:
document.getElementById("confirmarSenha").value


};



try {


await cadastrarEmpresa(dados);



alert(
"Loja cadastrada com sucesso!"
);



window.location.href =
"./admin/index.html";



}
catch(erro){


console.error(
"Erro cadastro:",
erro
);



alert(
"Erro ao cadastrar loja."
);


}


});

</script>

</body>

</html>
