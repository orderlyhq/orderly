<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Loja - Orderly</title>

<link rel="stylesheet" href="./css/cadastro.css">

</head>


<body>


<div class="cadastro-card">


<h2>
Cadastre sua loja
</h2>


<p>
Crie sua conta no Orderly
</p>



<form id="cadastroForm">


<h3>
Dados da empresa
</h3>


<input 
id="nomeFantasia"
placeholder="Nome fantasia"
/>


<input 
id="razaoSocial"
placeholder="Razão social"
/>


<input 
id="cnpj"
placeholder="CNPJ"
/>


<input 
id="telefone"
placeholder="Telefone"
/>


<input 
id="whatsapp"
placeholder="WhatsApp"
/>


<input 
id="emailEmpresa"
placeholder="Email da empresa"
/>


<input 
id="endereco"
placeholder="Endereço"
/>


<input 
id="cidade"
placeholder="Cidade"
/>


<input 
id="estado"
placeholder="Estado"
/>



<h3>
Dados do administrador
</h3>


<input 
id="nomeAdmin"
placeholder="Nome"
/>


<input 
id="emailAdmin"
placeholder="Email"
/>


<input 
id="senha"
type="password"
placeholder="Senha"
/>


<input 
id="confirmarSenha"
type="password"
placeholder="Confirmar senha"
/>



<button type="submit">
Criar loja
</button>


</form>


</div>


</body>

</html>
