<html>

<script type="module">

  db
} from "./js/services/firebase.js";


import {

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



await signInWithEmailAndPassword(
  auth,
  "admin@mesafacil.com",
  "SUA_SENHA"
);


console.log(

);


console.log(
  "EXISTE:",
  snap.exists()
);


console.log(
  "DADOS:",
  snap.data()
);
